name: Feature request
description: Propose new functionality, a new input reader, or a modeling improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current library does not let you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the API or behavior should look like. For modeling changes, cite the theory.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a GUI, plotting, or notebook feature (those belong in a separate package).
          required: true
