site_name: connflex-core
site_description: Headless extraction of reduced-order electromechanical models of SOI MEMS from GDS layouts and polygons
site_url: https://cao-rqm-lab.github.io/connflex-core/
repo_url: https://github.com/Cao-RQM-Lab/connflex-core
repo_name: Cao-RQM-Lab/connflex-core
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Usage: usage.md
  - Input conventions: conventions.md
  - Parameters: parameters.md
  - Theory of operation:
      - Overview: theory/index.md
      - Mechanical:
          - Layout, release, and beams: theory/extraction.md
          - Mass, stiffness, and modes: theory/mechanics.md
      - Electrical and electrostatic:
          - Electrodes and links: theory/electrical.md
          - Plates between device and handle: theory/plates.md
          - Sidewall capacitance: theory/sidewalls.md
          - Facing plates and the method for each pair: theory/methods.md
          - Capacitance of a structure: theory/capacitance.md
      - Electromechanical:
          - Static equilibrium: theory/equilibrium.md
          - Small signal: theory/small-signal.md
          - Transient: theory/transient.md
      - Field methods in depth:
          - Field solutions over travel: theory/motion.md
          - Fringe above and below the device layer: theory/fringe.md
          - Windows and rows over travel: theory/travel.md
      - Symbols and parameters: theory/symbols.md
  - Assumptions and limits: assumptions.md
  - API reference: api/index.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
